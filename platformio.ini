; ═══════════════════════════════════════════════════════════════════════════
; PlatformIO Configuration for ESP32-CAM OTTO Robot
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Build flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library dependencies
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1

; Upload settings (adjust port as needed)
; upload_port = /dev/ttyUSB0  ; Linux
; upload_port = COM3          ; Windows
upload_speed = 921600

; Extra scripts (optional)
; extra_scripts = pre:extra_script.py

; Partition table for camera support
board_build.partitions = huge_app.csv

; Flash settings
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; ═══════════════════════════════════════════════════════════════════════════
; Alternative environments for different ESP32-CAM boards
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32cam-debug]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_type = debug
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1

[env:esp32cam-ota]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; upload_port = 192.168.1.XXX  ; Set your ESP32-CAM IP address
build_flags = 
    -DBOARD_HAS_PSRAM
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1
